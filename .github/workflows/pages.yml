# เผยแพร่เว็บอ่านหนังสือขึ้น GitHub Pages ทุกครั้งที่เนื้อหา/เว็บเปลี่ยนบน main
#
# โหมด static: ไม่มี proxy บน Pages → ปุ่มถามผู้ช่วย AI จะบอกว่าเป็นเว็บอ่านอย่างเดียว
# และเมนู PDF ต้นฉบับ (A-01) ชี้ไปที่ไฟล์จริงใน repo สาธารณะนี้ (raw.githubusercontent.com)
# บทที่ยังไม่ ready จะถูก render เป็นหน้า "กำลังสร้าง" เท่านั้น เนื้อหาที่ยังไม่ผ่านการตรวจไม่ถูกเผยแพร่
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: ตรวจ schema + build (static, base = ชื่อ repo)
        env:
          BUILD_STATIC: '1'
          BASE_PATH: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '' || format('/{0}', github.event.repository.name) }}
        run: node web/build.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
